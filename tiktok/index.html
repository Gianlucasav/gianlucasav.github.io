<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok – autorizzazione</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}
  textarea{width:100%;height:120px;font-family:monospace;font-size:13px;box-sizing:border-box}
  button{margin-top:8px;padding:10px 18px;font-size:15px;cursor:pointer}
  .err{color:#b00020}
</style>
</head>
<body>
<h1>Autorizzazione TikTok</h1>
<div id="ok" hidden>
  <p>✅ Autorizzazione ricevuta. Copia <strong>tutto</strong> il testo qui sotto e incollalo nel terminale dove sta girando <code>auth_tiktok.py</code>.</p>
  <textarea id="url" readonly></textarea>
  <button id="copy">Copia</button> <span id="done" hidden>Copiato!</span>
</div>
<p id="error" class="err" hidden></p>
<p id="empty" hidden>Questa pagina serve solo a ricevere il codice di autorizzazione di TikTok.</p>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("code")) {
    document.getElementById("ok").hidden = false;
    document.getElementById("url").value = location.href;
    document.getElementById("copy").onclick = async () => {
      const box = document.getElementById("url");
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand("copy"); }
      document.getElementById("done").hidden = false;
    };
  } else if (params.get("error")) {
    const el = document.getElementById("error");
    el.hidden = false;
    el.textContent = "Errore da TikTok: " + params.get("error") + " – " + (params.get("error_description") || "");
  } else {
    document.getElementById("empty").hidden = false;
  }
</script>
</body>
</html>
